<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioAggregate</title>
<style>
:root {
  --bg: #fbfaf8; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
  --border: #e4e2dd; --accent: #a4161a; --accent-soft: #f6e7e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --surface: #1d1d20; --text: #ececee; --muted: #9a9aa2;
    --border: #2e2e33; --accent: #ef6f6c; --accent-soft: #3a2224;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 1.25rem; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
h3 { font-size: 1.1rem; margin: 6px 0 2px; line-height: 1.35; }
h3 a { color: var(--text); }
h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 4px; }
ul { margin: 4px 0; padding-left: 20px; }
.eyebrow { margin: 0; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; }
.meta, .byline, .note { color: var(--muted); font-size: 0.875rem; }
.byline { margin: 0; }
.note { margin-top: 16px; font-style: italic; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.toc a { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 0.875rem; background: var(--surface); }
.toc span { color: var(--muted); margin-left: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin: 16px 0; }
.kicker { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; font-size: 0.8rem; color: var(--muted); }
.journal { font-weight: 700; color: var(--text); }
.badge { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; font-weight: 600; }
.bottom-line { font-weight: 600; margin: 12px 0; padding-left: 12px; border-left: 3px solid var(--accent); }
.pico { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0; }
.pico dt { font-weight: 600; color: var(--muted); font-size: 0.875rem; }
.pico dd { margin: 0; }
.appraisal { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.editorials { margin-top: 12px; padding-top: 4px; border-top: 1px dashed var(--border); }
.abstract { white-space: pre-line; font-size: 0.9rem; }
.plain { list-style: none; padding: 0; }
.plain li { margin: 10px 0; }
.small { font-size: 0.9rem; }
.empty { color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); }
@media (max-width: 600px) {
  .pico { grid-template-columns: 1fr; }
  .pico dd { margin-bottom: 8px; }
  .appraisal { grid-template-columns: 1fr; }
}
</style></head>
<body>
<main>
<header class="masthead">
  <h1>CardioAggregate</h1>
  <p class="meta">Weekly digest of high impact cardiology trials, meta-analyses and large observational studies, with PICO summaries and accompanying editorials.</p>
</header>
<p class="empty">No digests yet.</p>
</main>
</body>
</html>
