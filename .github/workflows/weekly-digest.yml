name: Weekly digest

on:
  schedule:
    # Sundays 11:17 UTC. Change to suit your time zone.
    - cron: "17 11 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days (blank uses config.yaml)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q

      - name: Check journal abbreviations
        continue-on-error: true
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python -m cardioaggregate --check-journals

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "${{ inputs.days }}" ]; then
            python -m cardioaggregate --days "${{ inputs.days }}"
          else
            python -m cardioaggregate
          fi

      - name: Commit digest
        run: |
          git config user.name "cardioaggregate bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Digest $(date -u +%Y-%m-%d)"
            git push
          fi
