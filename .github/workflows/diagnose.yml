name: Diagnose search

# Manual only: counts PubMed hits per journal as each filter is added, to see
# where papers drop out. Free; does not touch the digest or use Claude.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        required: false
        default: "14"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python -m cardioaggregate diagnose --days "${{ inputs.days }}"
