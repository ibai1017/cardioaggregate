name: Email digest

# When the routine pushes a finished digest, email it once. Does nothing unless
# the SMTP secrets are set. Commits made by this workflow do not retrigger it.

on:
  push:
    branches: [main]
    paths: ["data/runs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest-repo-writes
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m cardioaggregate email

      - name: Record that it was sent
        run: |
          git config user.name "cardioaggregate bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Mark digest emailed"
            git pull --rebase origin main
            git push
          fi
