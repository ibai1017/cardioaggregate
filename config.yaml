# CardioAggregate configuration. Edit freely; every run reads this file.

# How far back to look for new articles (by PubMed "Entrez date", i.e. the day
# the record was added to PubMed). Seven days matches a weekly schedule; the
# history file prevents duplicates if windows overlap.
lookback_days: 7

# Editorials are often indexed later than the article they discuss, so look
# further back for them. Editorials that arrive after their article was already
# in a digest show up in a "Late editorials" section.
editorial_lookback_days: 28

# Journals are matched on their MEDLINE abbreviation (the [ta] field in PubMed).
#   topic_filter:  only keep articles that look cardiovascular (needed for
#                  general medical journals that publish everything)
#   design_filter: only keep articles whose abstract suggests an RCT,
#                  meta-analysis, systematic review or cohort/registry study
#   tier:          1 for the flagship general and cardiology journals (default 2);
#                  only used to decide which candidates Claude reads first
journals:
  # General medical journals: cardiovascular topics only
  - { abbr: "N Engl J Med", name: "NEJM", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "NEJM Evid", name: "NEJM Evidence", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "Lancet", name: "The Lancet", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "JAMA", name: "JAMA", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "JAMA Intern Med", name: "JAMA Internal Medicine", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "BMJ", name: "BMJ", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "Ann Intern Med", name: "Annals of Internal Medicine", tier: 1, topic_filter: true, design_filter: true }
  - { abbr: "Cochrane Database Syst Rev", name: "Cochrane", tier: 1, topic_filter: true, design_filter: false }

  # General cardiology
  - { abbr: "J Am Coll Cardiol", name: "JACC", tier: 1, topic_filter: false, design_filter: true }
  - { abbr: "Eur Heart J", name: "European Heart Journal", tier: 1, topic_filter: false, design_filter: true }
  - { abbr: "Circulation", name: "Circulation", tier: 1, topic_filter: false, design_filter: true }
  - { abbr: "JAMA Cardiol", name: "JAMA Cardiology", tier: 1, topic_filter: false, design_filter: true }

  # Heart failure and transplant
  - { abbr: "Eur J Heart Fail", name: "European Journal of Heart Failure", topic_filter: false, design_filter: true }
  - { abbr: "JACC Heart Fail", name: "JACC: Heart Failure", topic_filter: false, design_filter: true }
  - { abbr: "Circ Heart Fail", name: "Circulation: Heart Failure", topic_filter: false, design_filter: true }
  - { abbr: "J Heart Lung Transplant", name: "J Heart Lung Transplant", topic_filter: true, design_filter: true }

  # Electrophysiology
  - { abbr: "Heart Rhythm", name: "Heart Rhythm", topic_filter: false, design_filter: true }
  - { abbr: "Europace", name: "Europace", topic_filter: false, design_filter: true }
  - { abbr: "JACC Clin Electrophysiol", name: "JACC: Clinical Electrophysiology", topic_filter: false, design_filter: true }
  - { abbr: "Circ Arrhythm Electrophysiol", name: "Circulation: Arrhythmia and Electrophysiology", topic_filter: false, design_filter: true }

  # Interventional and structural
  - { abbr: "JACC Cardiovasc Interv", name: "JACC: Cardiovascular Interventions", topic_filter: false, design_filter: true }
  - { abbr: "EuroIntervention", name: "EuroIntervention", topic_filter: false, design_filter: true }
  - { abbr: "Circ Cardiovasc Interv", name: "Circulation: Cardiovascular Interventions", topic_filter: false, design_filter: true }

  # Imaging
  - { abbr: "JACC Cardiovasc Imaging", name: "JACC: Cardiovascular Imaging", topic_filter: false, design_filter: true }
  - { abbr: "Eur Heart J Cardiovasc Imaging", name: "EHJ Cardiovascular Imaging", topic_filter: false, design_filter: true }
  - { abbr: "Circ Cardiovasc Imaging", name: "Circulation: Cardiovascular Imaging", topic_filter: false, design_filter: true }

  # Prevention, hypertension, outcomes research, acute care, surgery
  - { abbr: "Eur J Prev Cardiol", name: "European Journal of Preventive Cardiology", topic_filter: false, design_filter: true }
  - { abbr: "Hypertension", name: "Hypertension", topic_filter: false, design_filter: true }
  - { abbr: "Circ Cardiovasc Qual Outcomes", name: "Circulation: Cardiovascular Quality and Outcomes", topic_filter: false, design_filter: true }
  - { abbr: "Eur Heart J Acute Cardiovasc Care", name: "EHJ Acute Cardiovascular Care", topic_filter: false, design_filter: true }
  - { abbr: "J Thorac Cardiovasc Surg", name: "J Thorac Cardiovasc Surg", topic_filter: true, design_filter: true }

  # Optional, high volume and mostly observational; uncomment to include:
  # - { abbr: "J Am Heart Assoc", name: "JAHA", topic_filter: false, design_filter: true }
  # - { abbr: "JAMA Netw Open", name: "JAMA Network Open", topic_filter: true, design_filter: true }

# Selection rules applied to the model's triage of each candidate.
# impact is the model's 1 to 5 rating of likely effect on cardiology practice.
selection:
  min_impact_rct: 3            # primary results of randomized trials
  min_impact_rct_secondary: 4  # post hoc / secondary analyses of trials
  min_impact_meta: 3           # meta-analyses and systematic reviews
  large_observational_n: 10000 # "very large" observational threshold
  min_impact_observational_large: 3
  min_impact_observational_other: 5
  target_articles: 10          # size of a normal week
  surge_min_impact: 4          # papers rated this or higher always get in...
  max_articles: 20             # ...up to this ceiling (e.g. ESC, AHA, ACC weeks)
  max_also_screened: 60        # how many near misses to list at the bottom
  max_triage: 80               # Claude only reads the top candidates by free prescore

# Only used by `python -m cardioaggregate api` (pay per use API instead of the
# routine on your Claude plan). Effort trades depth for cost.
llm:
  model: "claude-opus-5-5"
  triage_effort: "low"
  summary_effort: "medium"
  triage_batch_size: 40

# Where output goes. docs/ is what GitHub Pages serves.
output_dir: "docs"
history_file: "data/history.json"
